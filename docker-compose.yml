version: '3.8'

services:
  # Main application service
  seventwentyclocks:
    build:
      context: .
      dockerfile: Dockerfile
    ports:

      - "3000:3000"  # Maps container port 3000 to host port 3000
    restart: unless-stopped
    container_name: seventwentyclocks
    environment:
      - NODE_ENV=production
    # Add healthcheck to ensure container is running properly
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Limit resources to prevent container from consuming too much
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
